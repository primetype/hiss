[build]
target = "index.html"
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

# Trunk downloads and runs the TailwindCSS standalone CLI itself (driven by the
# `data-trunk rel="tailwind-css"` link in index.html). Pinning the version is
# load-bearing: WITHOUT this line Trunk 0.21.x silently defaults to the ancient
# tailwindcss 3.3.5. Pin a current v4 (config-less, CSS-first) release.
[tools]
tailwindcss = "4.1.18"
