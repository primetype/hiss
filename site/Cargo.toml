[package]
name = "hiss-site"
version = "0.1.0"
edition = "2021"
# No hiss dependency today, but phase 2 adds one as a dev-dependency (fixture
# pinning test), which needs hiss's toolchain. `rust-toolchain.toml` pins
# stable, which satisfies it.
rust-version = "1.96"
publish = false
license = "MIT OR Apache-2.0"
description = "The hiss one-page site (Leptos CSR + Trunk + TailwindCSS)."

[dependencies]
# UI: client-side-rendered Leptos. Deliberately NO hiss dependency: the
# shipped WASM carries no crypto. Handshake traces arrive in phase 2 as
# frozen fixtures generated by hiss and pinned by a test (a dev-dependency
# at that point) — see site/README.md.
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"

# The fixture generator/pinning test ONLY (tests/fixtures.rs): hiss runs the
# six patterns' handshakes deterministically (ChaCha20, fixed seeds) and the
# frozen traces in src/fixtures_data.in are asserted against it on every
# deploy. Dev-dependencies never reach the shipped WASM.
[dev-dependencies]
hiss = { path = ".." }
rand_core = "0.10"
rand_chacha = "0.10"

# A landing page wants the smallest artifact, not the fastest one.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Stand alone: do NOT get absorbed into (or absorb) the parent hiss package.
[workspace]
