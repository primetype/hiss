<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hiss — encrypted channels, checked by the compiler</title>
    <meta
      name="description"
      content="hiss is a Rust Noise Protocol implementation: encrypted, authenticated channels between two peers you control, with the handshake checked by the compiler."
    />
    <meta property="og:title" content="hiss — encrypted channels, checked by the compiler" />
    <meta
      property="og:description"
      content="You decide who proves themselves — the handshake enforces it, the compiler checks it. A Rust Noise Protocol implementation."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://primetype.co.uk/hiss/" />
    <!-- Absolute URL on purpose: crawlers do not resolve relative og:image
         paths reliably. The host is the org's custom domain, where GitHub
         Pages actually serves this site (primetype.github.io/hiss
         redirects). Regenerate the card with the script noted in
         site/README.md if the brand moves. -->
    <meta property="og:image" content="https://primetype.co.uk/hiss/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://primetype.co.uk/hiss/og.png" />

    <!-- The brand monogram: three static ticks resolving into one signal period. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cg stroke='%235a6068' stroke-width='3.5' stroke-linecap='round'%3E%3Cline x1='7' y1='16' x2='7' y2='32'/%3E%3Cline x1='14' y1='11' x2='14' y2='37'/%3E%3Cline x1='21' y1='19' x2='21' y2='29'/%3E%3C/g%3E%3Cpath d='M27 24q7-15 14 0' fill='none' stroke='%235bc8d6' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!-- Compile this crate to WASM. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" />

    <!-- Trunk downloads the tailwindcss CLI and compiles this stylesheet. -->
    <link data-trunk rel="tailwind-css" href="styles/input.css" />

    <!-- The social card, copied into dist/ as /og.png. -->
    <link data-trunk rel="copy-file" href="assets/og.png" />
  </head>
  <body class="bg-ink text-silver font-mono">
    <noscript>
      <div class="mx-auto max-w-2xl px-5 py-16">
        <p class="mb-4 text-[11.5px] uppercase tracking-[0.16em] text-silver-dim">
          noise protocol framework · rust · sans-io · no async runtime
        </p>
        <h1 class="text-3xl font-semibold leading-tight text-silver-bright">
          Encrypted, authenticated channels between two peers you control.
        </h1>
        <p class="mt-4 text-[15px] text-silver-dim">
          You decide who proves themselves — the handshake enforces it, the
          compiler checks it. This page's interactive parts need JavaScript
          (it is a WASM app), but everything it says lives in the README too.
        </p>
        <p class="mt-4 inline-block rounded-full border border-warn/50 px-3 py-1 text-xs text-warn">
          unaudited · pre-1.0 — use at your own risk
        </p>
        <pre class="mt-6 overflow-x-auto rounded-sm border border-line-soft bg-panel p-4 text-xs leading-6 text-silver-dim"><code><span class="text-cyan">hiss::noise!</span> {
    pub XX&lt;X25519, ChaChaPoly, Blake2b&gt; {
        -&gt; e
        &lt;- e, ee, s, es
        -&gt; s, se
    }
}</code></pre>
        <p class="mt-6 text-[13px]">
          <span class="text-silver-faint">$ </span>cargo add hiss
        </p>
        <p class="mt-6 text-xs text-silver-dim">
          <a class="text-cyan" href="https://docs.rs/hiss">docs.rs</a>
          ·
          <a class="text-cyan" href="https://crates.io/crates/hiss">crates.io</a>
          ·
          <a class="text-cyan" href="https://github.com/primetype/hiss">github</a>
          ·
          <a class="text-cyan" href="https://github.com/primetype/hiss#how-this-is-tested">how this is tested</a>
        </p>
      </div>
    </noscript>
  </body>
</html>
