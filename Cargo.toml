[workspace]
members = ["hiss-macros"]
# The one-page site, the snow interop suite and the AES-GCM validation lab
# are each their own independent crate/workspace.
exclude = ["site", "hiss-interop", "hiss-aesgcm-lab"]

[package]
name = "hiss"
version = "0.3.2"
edition = "2024"
# MSRV policy: pinned to a recent stable release, floored at `stable - 3` —
# i.e. bump only once it falls more than three releases behind current
# stable. Keep this in lockstep with the `msrv` job in .github/workflows.
rust-version = "1.96"
authors = ["Nicolas Di Prima <nicolas@primetype.co.uk>"]
license = "MIT OR Apache-2.0"
description = "Static, type-level Noise Protocol Framework with pluggable hardware-backed crypto."
readme = "README.md"
repository = "https://github.com/primetype/hiss"
# The one-page site (site/), served by GitHub Pages under the org's custom
# domain — primetype.github.io/hiss redirects here.
homepage = "https://primetype.co.uk/hiss/"
documentation = "https://docs.rs/hiss"
keywords = ["noise", "handshake", "secure-enclave", "x25519", "keychain"]
categories = ["cryptography", "network-programming"]
# `site/` (the one-page site), `hiss-interop/` (the `snow` comparison suite)
# and `hiss-aesgcm-lab/` (the AES-GCM validation lab) are separate,
# non-published crates that depend on this one by path (`site` only as a
# dev-dependency of its fixture-pinning test); `hiss-macros` is published
# separately. Keep all four out of the packaged crate. NOTE:
# `hiss-aesgcm-lab/` carries a **git** dependency; it must never appear in
# this manifest's `[dependencies]` or in a root `[patch]`, or hiss stops
# being publishable. The second row is repo infrastructure that means nothing
# outside the repository; tests/ (vectors included) ships on purpose, so the
# KAT and Wycheproof gates run against the exact published bytes.
exclude = [
    "/site", "/hiss-macros", "/hiss-interop", "/hiss-aesgcm-lab",
    "/.github", "/scripts", "/CLAUDE.md", "/TODO.md", "/deny.toml", "/.gitignore",
]

# docs.rs builds with every feature and passes `--cfg docsrs`, so the
# `#[doc(cfg(...))]` feature/platform badges (gated behind
# `cfg_attr(docsrs, ...)`) render.
#
# Apple-only items (`AppleSecureEnclave`, the Secure Enclave provider) do not
# exist on a Linux build, so the default docs.rs target omits them entirely.
# Building an Apple target as well puts them in the platform selector; without
# this the Secure Enclave support is undocumented on docs.rs no matter what the
# source says. `default-target` is pinned explicitly so adding `targets` does
# not silently promote the first entry to the default.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = ["aarch64-apple-darwin"]


[dependencies]
# Written as an explicit range, both ends deliberate.
#
# Lower bound — 0.6.0 is where the API this crate uses arrived, and the
# reason this is no longer `>=0.5.1, <0.6`. 0.6.0 deleted `src/mac.rs` and
# the generic `Hmac<D: Digest>`, replaced them with `hmac::Context<A:
# Algorithm>`, and stopped auto-building the legacy root hashing modules in
# favour of the `hashing` submodule. `src/noise/hash.rs` and
# `src/curve/p256/mod.rs` are written against the new shape and do not
# compile against 0.5.x. Nothing here reaches for anything newer: the files
# carrying every API this crate touches — `hmac.rs`, `hashing/blake2b.rs`,
# `hashing/blake2s.rs`, `hashing/sha2/mod.rs`, `chacha20poly1305.rs` — are
# byte-identical between 0.6.0 and 0.6.2, so 0.6.1 (arm32) and 0.6.2
# (SHAKE, ML-KEM) buy this crate nothing and are not required.
#
# Upper bound — the same ceiling `^0.6.0` already implied (`<0.7.0`),
# spelled out rather than inferred. Note what it does *not* buy: a breaking
# change shipped inside the 0.6.x line would still land here, exactly as
# eccoxide 0.4.3 did. What catches that is `scripts/downstream-build.sh`
# (a gate — see CLAUDE.md), which resolves hiss with no lockfile the way a
# consumer does.
#
# `hmac` and `sha2` are load-bearing beyond hashing: `hmac` gates the module
# holding `Algorithm`/`Context`/`Tag`, and `sha2` gates cryptoxide's own
# HMAC-SHA-256/512 impls (`src/hmac.rs:153-157`). HMAC-BLAKE2 of either
# width is *not* shipped, so `src/noise/hash.rs` carries local marker types
# implementing `hmac::Algorithm` over `hashing::blake2{b,s}::Context` —
# local because the orphan rule forbids implementing cryptoxide's trait for
# cryptoxide's type. `digest` is deliberately absent: it would restore the
# deprecated root modules and pull in `alloc` without restoring `mac`.
cryptoxide = { version = ">=0.6.0, <0.7", default-features = false, features = ["chacha", "poly1305", "blake2", "sha2", "hmac", "ed25519"] }
# Written as an explicit range, both ends deliberate.
#
# Lower bound — a hard API floor, and the reason this is not still `"0.4"`.
# eccoxide 0.4.3 changed `PointAffine::decompress` from `Option` to the
# constant-time `CtOption`, so `src/curve/p256/mod.rs` calls `.into_option()`
# and no longer compiles against 0.4.0–0.4.2.
#
# Upper bound — the same ceiling `^0.4` already implied (`<0.5.0`), spelled
# out rather than inferred. Note what it does *not* buy: 0.4.3 was itself a
# breaking change shipped in a patch release, so a future 0.4.x could break
# this crate the same way. What catches that is `scripts/downstream-build.sh`
# (a gate — see CLAUDE.md), which resolves hiss with no lockfile the way a
# consumer does. Narrow this to `<0.4.4` if that risk should instead be borne
# by the requirement, at the cost of needing a hiss release before consumers
# can pick up any eccoxide 0.4.x fix.
eccoxide = { version = ">=0.4.3, <0.5", default-features = false, features = ["p256r1", "table", "x25519", "x448"] }
hex = "0.4"
# The `noise!` pattern-DSL macro — the built-in patterns are defined with
# it, so it is a required (build-time-only) dependency.
hiss-macros = { version = "0.3.1", path = "hiss-macros" }
packtool = "0.6"
rand_core = "0.10"
thiserror = "2"

[features]
# X25519's software DH backend defaults to `cryptoxide`'s `x25519`: it
# benchmarks faster than the `eccoxide` Montgomery ladder (the cross-library
# comparison against snow lives in `hiss-interop/benches/comparison.rs`).
# Build with `--no-default-features` to fall back to
# `eccoxide` (the ladder shared with X448) — output is byte-for-byte
# identical, so the choice only affects which dependency carries the
# primitive. The backends are additive, not mutually exclusive (so
# `--all-features` builds): when both are available the cryptoxide backend
# wins.
default = ["x25519-cryptoxide"]
x25519-cryptoxide = ["cryptoxide/x25519"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = { version = "0.10", features = [] }
# `OSX_10_15` is the only `OSX_10_*` flag that still gates code in
# security-framework 3.x — it enables the `DataProtectionKeychain` location
# we set in `provider/apple.rs`. The lower `OSX_10_12/13/14` flags are inert
# empty features in this version, so we don't list them.
security-framework = { version = "3.5", features = ["OSX_10_15"] }
security-framework-sys = "2.15"

[dev-dependencies]
base64 = "0.23"
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.6"
rand = "0.10"
# Wycheproof / Noise test-vector ingestion (test-only; never in the
# published crate — see tests/vectors/).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.50", features = ["macros", "rt", "rt-multi-thread", "net", "signal", "time", "sync", "io-util", "fs"] }
# Compile-fail (UI) harness for the `noise!` parser diagnostics
# (`tests/macro_ui.rs` + `tests/ui/`). Test-only; hosted in the root crate
# because CI's gate commands are root-package scoped (`hiss-macros`'s own
# `tests/` never run under `cargo test`).
trybuild = "1.0"

[[bench]]
name = "noise"
harness = false

[[example]]
name = "tcp_xx_channel"

[[example]]
name = "tcp_ikpsk1_ceremony"
