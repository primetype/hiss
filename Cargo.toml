[package]
name = "hiss"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Nicolas Di Prima <nicolas@primetype.co.uk>"]
license = "MIT OR Apache-2.0"
description = "Static, type-level Noise Protocol Framework with pluggable hardware-backed crypto."
repository = "https://github.com/primetype/hiss"
homepage = "https://github.com/primetype/hiss"
documentation = "https://docs.rs/hiss"
keywords = ["noise", "cryptography", "handshake", "secure-enclave", "p256"]
categories = ["cryptography", "network-programming"]


[dependencies]
cryptoxide = { version = "0.5.1", default-features = false, features = ["chacha", "poly1305", "blake2", "sha2", "hmac", "ed25519"] }
eccoxide = { git = "https://github.com/vincenthz/eccoxide", rev = "722797f691129e02c8d54621838b6b41c3e48ea3", default-features = false, features = ["p256r1", "table"] }
getrandom = "0.3"
hex = "0.4"
packtool = "0.4"
rand_core = "0.9"
thiserror = "2"
# Only pulled in by the `async-io` feature (the `tokio::io` handshake
# layer). On macOS/iOS tokio is already a non-optional platform dep below
# (for the Apple Secure Enclave offload); there the feature merely adds
# `io-util` on top of `rt`.
tokio = { version = "1.50", default-features = false, optional = true }

[features]
# The blocking `std::io` handshake (`io_sync`) is always available and
# needs no runtime. `async-io` adds the `tokio::io` mirror (`io_async`),
# pulling in tokio with its I/O extension traits.
async-io = ["dep:tokio", "tokio/io-util"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = { version = "0.10", features = [] }
security-framework = { version = "3.5", features = ["OSX_10_12", "OSX_10_13", "OSX_10_14", "OSX_10_15"] }
security-framework-sys = "2.15"
# The Secure Enclave / Security-framework calls are synchronous, blocking
# C FFI. The async `CryptoProvider` impl offloads them to Tokio's blocking
# thread pool (`spawn_blocking`) so they never block the async executor.
tokio = { version = "1.50", default-features = false, features = ["rt"] }

[dev-dependencies]
base64 = "0.22"
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.6"
rand = "0.9"
snow = { version = "0.10.0", features = ["default-resolver", "use-p256", "use-chacha20poly1305", "use-blake2"] }
tempfile = "3.12"
tokio = { version = "1.50", features = ["macros", "rt", "rt-multi-thread", "net", "signal", "time", "sync", "io-util", "fs"] }

[[bench]]
name = "noise"
harness = false
