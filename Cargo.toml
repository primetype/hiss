[workspace]
members = ["hiss-macros"]
# The browser playground is its own independent crate/workspace.
exclude = ["demo"]

[package]
name = "hiss"
version = "0.1.0"
edition = "2024"
# MSRV policy: pinned to a recent stable release, floored at `stable - 3` —
# i.e. bump only once it falls more than three releases behind current
# stable. Keep this in lockstep with the `msrv` job in .github/workflows.
rust-version = "1.96"
authors = ["Nicolas Di Prima <nicolas@primetype.co.uk>"]
license = "MIT OR Apache-2.0"
description = "Static, type-level Noise Protocol Framework with pluggable hardware-backed crypto."
readme = "README.md"
repository = "https://github.com/primetype/hiss"
homepage = "https://github.com/primetype/hiss"
documentation = "https://docs.rs/hiss"
keywords = ["noise", "handshake", "secure-enclave", "x25519", "keychain"]
categories = ["cryptography", "network-programming"]
# The browser playground (`demo/`) is a separate, non-published crate that
# depends on this one by path; `hiss-macros` is published separately. Keep
# both out of the packaged crate.
exclude = ["/demo", "/hiss-macros"]

# docs.rs builds with every feature so the `async-io` driver is documented,
# and passes `--cfg docsrs` so the `#[doc(cfg(...))]` feature/platform badges
# (gated behind `cfg_attr(docsrs, ...)`) render. Apple-only items still only
# appear on an Apple target; the default docs.rs (Linux) build omits them.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
cryptoxide = { version = "0.5.1", default-features = false, features = ["chacha", "poly1305", "blake2", "sha2", "hmac", "ed25519"] }
eccoxide = { version = "0.4", default-features = false, features = ["p256r1", "table", "x25519", "x448"] }
hex = "0.4"
# The `noise!` pattern-DSL macro — the built-in patterns are defined with
# it, so it is a required (build-time-only) dependency.
hiss-macros = { version = "0.1.0", path = "hiss-macros" }
packtool = "0.4"
rand_core = "0.9"
thiserror = "2"
# Only pulled in by the `async-io` feature (the `tokio::io` handshake
# layer). On macOS/iOS tokio is already a non-optional platform dep below
# (for the Apple Secure Enclave offload); there the feature merely adds
# `io-util` on top of `rt`.
tokio = { version = "1.50", default-features = false, optional = true }

[features]
# X25519's software DH backend defaults to `cryptoxide`'s `x25519`: it
# benchmarks faster than the `eccoxide` Montgomery ladder (and beats snow in
# the `noise` bench). Build with `--no-default-features` to fall back to
# `eccoxide` (the ladder shared with X448) — output is byte-for-byte
# identical, so the choice only affects which dependency carries the
# primitive. The backends are additive, not mutually exclusive (so
# `--all-features` builds): when both are available the cryptoxide backend
# wins.
default = ["x25519-cryptoxide"]
x25519-cryptoxide = ["cryptoxide/x25519"]
# The blocking `std::io` handshake (`io_sync`) is always available and
# needs no runtime. `async-io` adds the `tokio::io` mirror (`io_async`),
# pulling in tokio with its I/O extension traits.
async-io = ["dep:tokio", "tokio/io-util"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = { version = "0.10", features = [] }
# `OSX_10_15` is the only `OSX_10_*` flag that still gates code in
# security-framework 3.x — it enables the `DataProtectionKeychain` location
# we set in `provider/apple.rs`. The lower `OSX_10_12/13/14` flags are inert
# empty features in this version, so we don't list them.
security-framework = { version = "3.5", features = ["OSX_10_15"] }
security-framework-sys = "2.15"
# The Secure Enclave / Security-framework calls are synchronous, blocking
# C FFI. The async `CryptoProvider` impl offloads them to Tokio's blocking
# thread pool (`spawn_blocking`) so they never block the async executor.
tokio = { version = "1.50", default-features = false, features = ["rt"] }

[dev-dependencies]
base64 = "0.22"
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.6"
rand = "0.9"
# Wycheproof / Noise test-vector ingestion (test-only; never in the
# published crate — see tests/vectors/).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10.0", features = ["default-resolver", "use-p256", "use-chacha20poly1305", "use-blake2"] }
tempfile = "3.12"
tokio = { version = "1.50", features = ["macros", "rt", "rt-multi-thread", "net", "signal", "time", "sync", "io-util", "fs"] }
# Compile-fail (UI) harness for the `noise!` parser diagnostics
# (`tests/macro_ui.rs` + `tests/ui/`). Test-only; hosted in the root crate
# because CI's gate commands are root-package scoped (`hiss-macros`'s own
# `tests/` never run under `cargo test`).
trybuild = "1.0"

[[bench]]
name = "noise"
harness = false

[[example]]
name = "tcp_xx_channel"
required-features = ["async-io"]

[[example]]
name = "tcp_ikpsk1_ceremony"
