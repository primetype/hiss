name: Test

# Stage 2 of the pipeline. Triggers on completion of the `Check` workflow
# and runs only when Check succeeded. Tests the exact commit Check
# validated (workflow_run checks out the default branch by default, so we
# pin the ref to the triggering commit).

on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # X25519's software backend is feature-selected: the `x25519-cryptoxide`
      # default feature picks cryptoxide, `--no-default-features` falls back
      # to eccoxide. Run every feature/backend combination so neither path
      # rots and both stay byte-for-byte interoperable.
      - name: test (default features — cryptoxide X25519)
        run: cargo test
      - name: test (all features — cryptoxide X25519 + async-io)
        run: cargo test --all-features
      - name: test (no default features — eccoxide X25519)
        run: cargo test --no-default-features
      - name: test (eccoxide X25519 + async-io)
        run: cargo test --no-default-features --features async-io
