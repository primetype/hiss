name: AES-GCM lab

# Runs the AES-GCM early-validation suite in `hiss-aesgcm-lab/` — an
# unpublished, out-of-workspace crate that depends on hiss by path and on an
# unreleased, `rev`-pinned cryptoxide by git. See hiss-aesgcm-lab/README.md.
#
# This is a workflow of its own rather than a job in `Check`, for the same
# reason `Interop` and `Downstream` are: it needs a `schedule:` trigger, and
# `Check` is the trigger for `Test` and `Coverage` (both `workflow_run:
# workflows: ["Check"]`), so a cron on `Check` would drag the whole pipeline
# through a full run on every tick. A separate workflow name is not matched by
# those filters, so the cron costs exactly the jobs below.
#
# **This is not a release gate.** Nothing here runs under hiss's `cargo test`,
# and CLAUDE.md's gate table deliberately does not list it. A red run is a
# finding about cryptoxide's unreleased AES-GCM, or about this harness — not a
# hiss regression: hiss ships no AES-GCM, and nothing a consumer of `hiss`
# resolves is affected by this directory existing.
#
# **Temporary.** The crate has an expiry condition — cryptoxide publishing a
# release containing `aes_gcm` — at which point the lab dissolves into hiss
# proper and this file is deleted. Exit criteria are in the crate's README.

on:
  # Deliberately NO `push` and NO `pull_request`, which is where this differs
  # from `interop.yml`. The lab tests one frozen upstream commit that no push
  # to *this* repo can change, so a per-push run would re-measure an unchanged
  # dependency against unchanged code. `interop.yml` runs on push to main
  # because `snow` is a moving registry dependency; nothing here moves.
  schedule:
    # Weekly, offset from Interop's `43 6 * * 1` so the two do not contend.
    # With the rev pinned, this catches *local* bitrot — a toolchain release,
    # a snow release, a vanished upstream repo — rather than upstream drift.
    - cron: "43 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aesgcm-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: hiss-aesgcm-lab

jobs:
  lab:
    name: AES-GCM lab (${{ matrix.os }} — ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One backend failing must not hide the other's result — the whole point
      # of the matrix is that they compile different code.
      fail-fast: false
      matrix:
        include:
          # cryptoxide's AES backend is chosen at compile time by
          # `#[cfg(all(target_arch = "aarch64", target_feature = "aes"))]`.
          # Measured with `rustc --print cfg`: the `aes` target feature is on
          # by default on `aarch64-apple-darwin` ONLY — not on
          # x86_64-unknown-linux-gnu and, importantly, not on
          # aarch64-unknown-linux-gnu either. So being arm64 is not sufficient
          # and `ubuntu-24.04-arm` would be an inert duplicate of the x86 leg.
          #
          # x86_64: no `aes` feature => cryptoxide's portable reference AES.
          - os: ubuntu-latest
            backend: portable AES
          # Apple Silicon: `aes` on by default => cryptoxide's aarch64
          # intrinsics. The ONLY hosted runner that reaches that code.
          #
          # Cost note: macOS runners bill at a multiplier on *private* repos.
          # This repo is public, where they are free. If it is ever made
          # private, drop this row and accept that the hardware path is covered
          # by the maintainer's local run instead.
          - os: macos-latest
            backend: aarch64 hardware AES
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # NOTE: no `cargo update`, deliberately — and this is the opposite of
      # `interop.yml`, which does run one on its schedule to catch new `snow`
      # releases. Here the whole point is a frozen upstream commit, and
      # `hiss-aesgcm-lab/Cargo.lock` is committed to keep it frozen. Refreshing
      # it would defeat the pin. Release-detection is the exit trigger, not a
      # lockfile refresh.

      # Default features: hiss's cryptoxide X25519 backend.
      - name: cargo test (default features)
        run: cargo test

      # hiss's eccoxide Montgomery ladder. This is a real second leg, not a
      # duplicate: the lab's `[features]` passthrough is what makes
      # `--no-default-features` actually reach it. Verify with
      # `cargo tree --no-default-features -f "{p} {f}"` — `hiss` must appear
      # WITHOUT `x25519-cryptoxide`.
      - name: cargo test (eccoxide X25519 ladder)
        run: cargo test --no-default-features

      # Build-only, following `interop.yml`'s precedent: benchmark numbers from
      # a shared CI runner are not meaningful, but a comparison bench that
      # stops compiling is a real break. The numbers are for the maintainer to
      # take locally, where the host — and therefore which AES backend is being
      # measured — is known.
      - name: cargo bench --no-run
        run: cargo bench --no-run

      # NOTE: no `RUSTFLAGS="-C target-feature=-aes"` leg anywhere. It cannot
      # work: `snow`'s default `std` feature puts `ring` in the dev graph, and
      # ring 0.17 fails const-eval under that flag on aarch64-apple-darwin
      # (`assertion failed: (CAPS_STATIC & MIN_STATIC_FEATURES) ==
      # MIN_STATIC_FEATURES`). `RUSTFLAGS` is package-global, so `--test`
      # scoping does not help. The matrix above reaches both backends
      # natively, which is also a more faithful test than a synthetic flag —
      # each leg is a configuration someone actually ships on.
