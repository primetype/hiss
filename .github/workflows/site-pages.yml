name: Deploy site

# Builds the one-page site (`/site`) and publishes it to GitHub Pages. This
# workflow REPLACED demo-pages.yml — a repository has exactly one Pages slot,
# and the site now owns it.
#
# This is INDEPENDENT of the core-crate pipeline (`check.yml` → `test.yml` →
# `coverage.yml`). The site is its own cargo workspace, excluded from the
# published hiss crate (root `Cargo.toml` `exclude = ["/site"]`), so it never
# touches the crate's build or release gates. The paths include `src/**` and
# `hiss-macros/**` because the fixture-pinning test (site/tests/fixtures.rs)
# has a dev-dependency on hiss: an API or wire change must re-run the pin —
# and fail loudly here — rather than leave the page claiming stale bytes.
#
# Prerequisites (one-time, on GitHub) before this can actually deploy:
#   1. The repo must be PUBLIC, or on a paid plan (Pages from a private repo
#      needs GitHub Pro/Team/Enterprise).
#   2. Settings → Pages → Source = "GitHub Actions".
# Until then this workflow can sit committed and dormant — the `deploy` job
# will fail (Pages not enabled), but nothing else is affected.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "hiss-macros/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

# Least privilege for the build job; the deploy job needs id-token + pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Unlike the crate pipeline we do NOT cancel an
# in-progress run — a half-cancelled production deploy is worse than waiting.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (trunk → wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # The site is a separate workspace; point the cache at it (rust-cache
          # keys off its Cargo.lock, which is committed for reproducibility).
          workspaces: site
      # Prebuilt trunk binary (fast); trunk then auto-downloads the pinned
      # tailwindcss 4.1.18, wasm-bindgen, and wasm-opt at build time.
      # The pin before the build: the frozen traces the page replays must be
      # exactly what hiss produces today, or nothing deploys.
      - run: cargo test
      - uses: jetli/trunk-action@v0.5.1
      # `--public-url` is load-bearing: a project Pages site serves under
      # `https://<owner>.github.io/<repo>/`, so asset hrefs must be prefixed
      # with `/hiss/` or they 404 against the domain root. For a custom domain
      # or a user/org page, change this to `/`.
      - run: trunk build --release --public-url "/hiss/"
      # Payload budget from the site plan: 100 KB gzipped across wasm+js+css.
      # A landing page that outgrows this has stopped being slick.
      - name: check payload budget (100 KB gz)
        run: |
          total=0
          for f in dist/*.wasm dist/*.js dist/*.css; do
            [ -e "$f" ] || continue
            sz=$(gzip -9 -c "$f" | wc -c)
            printf '%8d gz  %s\n' "$sz" "$f"
            total=$((total + sz))
          done
          printf '%8d gz  TOTAL (budget 102400)\n' "$total"
          [ "$total" -le 102400 ]
      - uses: actions/upload-pages-artifact@v5
        with:
          # Relative to the repo root (this is a `uses:` step, so the
          # `working-directory` default above does not apply to it).
          path: site/dist

  deploy:
    name: deploy (GitHub Pages)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
