# Make the snow arm of the comparison bench compete at RustCrypto's best.
#
# In the versions snow resolves, RustCrypto's aarch64 hardware paths are
# OPT-IN: `aes` 0.8.4 gates its ARMv8 AES intrinsics behind `--cfg aes_armv8`
# and `polyval` 0.6.2 gates PMULL behind `--cfg polyval_armv8`. Neither is on
# by default, so a plain build — ours, and an ordinary snow consumer's —
# runs RustCrypto's *software* AES and POLYVAL on Apple Silicon. (x86-64 is
# different: AES-NI and CLMUL are runtime-detected there, no flag needed.)
#
# This lab exists to judge cryptoxide's AES-GCM against the strongest
# available reference, so these cfgs pin the snow arm to RustCrypto's
# hardware path on aarch64. Measured effect on `transport_1KiB` (M-series):
# snow/AESGCM 11.1 µs → 1.3 µs. The flags are inert for every other crate
# in the graph — they are plain `--cfg`s, consumed only by `aes`/`polyval`'s
# own `cfg(...)` gates (contrast the `-C target-feature` experiment the
# README forbids, which breaks `ring`'s const-eval).
#
# Gotcha: a RUSTFLAGS environment variable OVERRIDES config-file rustflags
# entirely. If you set RUSTFLAGS for any reason, the snow arm silently
# degrades to the software path — re-add these two cfgs to your value.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
