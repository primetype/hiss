[package]
name = "hiss-aesgcm-lab"
version = "0.1.0"
edition = "2024"
# Depends on `hiss` (edition 2024, MSRV 1.96) by path, so this crate needs at
# least the same toolchain. cryptoxide master itself declares only 1.79, so
# hiss's floor is the binding one.
rust-version = "1.96"
publish = false
license = "MIT OR Apache-2.0"
description = "Early-validation lab for Noise AESGCM against an unreleased cryptoxide. Temporary by construction — see README.md."

[dependencies]
# The crate under test, by path. NO feature list here: the `[features]` block
# below is what selects hiss's X25519 backend, so `--no-default-features` is a
# real second leg. Naming `features = ["x25519-cryptoxide"]` on this line
# instead would pin the backend unconditionally — dependency features are not
# negated by the dependent's `--no-default-features` — and would silently
# reduce that leg to a duplicate run.
hiss = { path = "..", default-features = false }

# The point of this crate. A **renamed direct** dependency, not a
# `[patch.crates-io]`: cargo accepts the same package name at the same version
# (0.6.2) from two different sources, so `hiss` keeps resolving the *released*
# cryptoxide it actually ships while only the AES-GCM code below sees master.
# That is exact fault isolation — a red run here is an AES-GCM finding, not
# "master broke BLAKE2".
#
# The usual hazard with two copies of one crate is type identity. It cannot
# arise here: hiss's `Cipher` trait is pure bytes (`&[u8; 32]`, `u64`,
# `&[u8]`), so the two copies never meet at a type boundary.
#
# The rev is the full 40-char form deliberately — a pin should be unambiguous —
# and NOT `branch = "master"`, because the whole point is a frozen commit.
# **Accepted risk:** the pin has no source escrow; see README.md.
cryptoxide_git = { package = "cryptoxide", git = "https://github.com/typed-io/cryptoxide", rev = "62056f46e2a5001b11d505dce37d301cb8ec7e28", default-features = false, features = ["aes-gcm"] }

[features]
# Mirrors `hiss-interop/Cargo.toml`'s passthrough shape verbatim, and for the
# same reason: it is what makes `cargo test --no-default-features` actually
# reach hiss's eccoxide Montgomery ladder instead of re-running the cryptoxide
# one. The gate that proves it is live:
#
#     cargo tree --no-default-features -f "{p} {f}"
#
# must show `hiss` **without** `x25519-cryptoxide`. If it still lists the
# feature, the second leg is testing nothing.
default = ["x25519-cryptoxide"]
x25519-cryptoxide = ["hiss/x25519-cryptoxide"]

[dev-dependencies]
# `use-aes-gcm` is the point — it is what makes snow's default resolver hand
# back a `CipherAesGcm` (RustCrypto `aes_gcm::Aes256Gcm`), a genuinely
# independent AES-GCM from cryptoxide's. `use-sha2`/`use-blake2` give the live
# interop all four Noise hashes.
#
# `use-chacha20poly1305` is deliberately NOT listed: ChaChaPoly interop is
# `hiss-interop`'s job, not this crate's. Note this is a statement of intent,
# not a graph change — snow's default `default-resolver-crypto` pulls it in
# regardless, and this crate does not set `default-features = false` on snow.
snow = { version = "0.10.0", features = ["default-resolver", "use-aes-gcm", "use-sha2", "use-blake2"] }

# The AEAD comparison bench. Version mirrors `hiss-interop`'s exactly, so the
# two benches are measured by the same criterion and their numbers can be put
# side by side.
criterion = { version = "0.8.2", features = ["html_reports"] }

hex = "0.4"
rand = "0.10"
# Vector-schema derives and the pretty-printed write in the extractor.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "aesgcm_comparison"
harness = false

# Stand alone: do NOT get absorbed into (or absorb) the parent hiss package.
[workspace]
